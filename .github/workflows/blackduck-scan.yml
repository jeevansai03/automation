name: Black Duck SCA Scan

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  blackduck-scan:
    runs-on: self-hosted    # <-- Changed from ubuntu-latest

    defaults:
      run:
        working-directory: automation

    env:
      DETECT_PROJECT_NAME: ${{ github.event.repository.name }}
      DETECT_PROJECT_VERSION_NAME: ${{ github.event_name != 'pull_request' && github.ref_name || github.event.pull_request.base.ref }}
      BLACKDUCK_TRUST_CERT: 'true'
      LOGGING_LEVEL_DETECT: 'DEBUG'
      DETECT_CLEANUP: 'false'
      DETECT_TOOLS: 'DETECTOR'
      DETECT_SOURCE_PATH: ${{ github.workspace }}/automation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify pom.xml
        run: |
          echo "=== Current Directory ==="
          pwd
          echo "=== pom.xml found ==="
          ls -la pom.xml

      - name: Verify Java and Maven
        run: |
          echo "=== Java Version ==="
          java --version
          echo "=== Maven Version ==="
          mvn --version

      - name: Build with Maven (resolve dependencies)
        run: mvn dependency:resolve -B

      - name: Run Black Duck Security Scan
        uses: blackduck-inc/black-duck-security-scan@v2
        with:
          blackducksca_url: ${{ secrets.BLACKDUCK_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCK_API_TOKEN }}
          blackducksca_scan_full: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          blackducksca_prcomment_enabled: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          blackducksca_externalIssues_create: true
          blackducksca_detect_args: --blackduck.trust.cert=true --logging.level.detect=DEBUG --detect.cleanup=false
          github_token: ${{ secrets.GITHUB_TOKEN }}
